x-app-env: &app-env
  OPSPILOT_APP_ENV: development
  OPSPILOT_EXECUTION_MODE: in_process
  OPSPILOT_DATABASE_URL: postgresql://opspilot:opspilot@postgres:5432/opspilot
  OPSPILOT_REMEDIATION_MODE: simulate
  PORT: 8080

x-app: &app
  build: .
  environment: *app-env
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  healthcheck:
    test: [CMD, python, -c, import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  api:
    <<: *app
    command: [python, -m, app.run, --role, api]
    ports:
      - ${PORT:-8080}:8080
  triage:
    <<: *app
    profiles: [topology]
    command: [python, -m, app.run, --role, triage]
  knowledge:
    <<: *app
    profiles: [topology]
    command: [python, -m, app.run, --role, knowledge]
  resolution:
    <<: *app
    profiles: [topology]
    command: [python, -m, app.run, --role, resolution]
  postgres:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U opspilot -d opspilot]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
