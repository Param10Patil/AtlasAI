<!doctype html>
<html lang='en'>
  <head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <title>OpsPilot - Incident investigation</title>
    <link rel='stylesheet' href='/static/styles.css' />
  </head>
  <body>
    <main class='shell'>
      <p class='eyebrow'>OPSPILOT</p>
      <h1>AI incident investigation assistant</h1>
      <p class='lede'>Describe what went wrong. OpsPilot will return an evidence-aware recommendation.</p>
      <form id='incident-form'>
        <label for='incident-description'>Incident description</label>
        <textarea id='incident-description' name='description' maxlength='4000' required></textarea>
        <button type='submit'>Analyze incident</button>
      </form>
      <p id='status' role='status' aria-live='polite'></p>
    </main>
    <script src='/static/app.js' defer></script>
  </body>
</html>
