apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: ops-demo
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: opspilot-demo
  annotations:
    opspilot.io/managed-demo: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/part-of: opspilot-demo
    spec:
      containers:
        - name: checkout-api
          image: nginx:1.25-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: ops-demo
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: opspilot-demo
spec:
  selector:
    app.kubernetes.io/name: checkout-api
  ports:
    - name: http
      port: 80
      targetPort: http
