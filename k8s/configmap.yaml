apiVersion: v1
kind: ConfigMap
metadata:
  name: opspilot-config
  namespace: opspilot
data:
  OPSPILOT_APP_ENV: kubernetes
  OPSPILOT_EXECUTION_MODE: http
  OPSPILOT_LOG_LEVEL: INFO
  OPSPILOT_DATABASE_URL: postgresql://opspilot@postgres:5432/opspilot
  OPSPILOT_ACTIVE_ANALYSIS_SLOTS: '1'
  OPSPILOT_QUEUE_CAPACITY: '1'
  OPSPILOT_REMEDIATION_MODE: simulate
