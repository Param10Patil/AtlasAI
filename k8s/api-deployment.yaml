apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: opspilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opspilot-api
  template:
    metadata:
      labels:
        app: opspilot-api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: opspilot:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: opspilot-config
            - secretRef:
                name: opspilot-secrets
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: opspilot-secrets
                  key: OPSPILOT_DATABASE_PASSWORD
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
          readinessProbe:
            httpGet: {path: /api/ready, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /api/health, port: 8080}
            failureThreshold: 30
            periodSeconds: 2
