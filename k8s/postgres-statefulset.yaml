apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: opspilot
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: opspilot-postgres}
  template:
    metadata: {labels: {app: opspilot-postgres}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: opspilot
            - name: POSTGRES_DB
              value: opspilot
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opspilot-secrets
                  key: OPSPILOT_DATABASE_PASSWORD
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 768Mi}
          readinessProbe:
            exec:
              command: [pg_isready, -U, opspilot, -d, opspilot]
  volumeClaimTemplates:
    - metadata: {name: postgres-data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
