apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge
  namespace: opspilot
spec:
  replicas: 1
  selector:
    matchLabels: {app: opspilot-knowledge}
  template:
    metadata: {labels: {app: opspilot-knowledge}}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: knowledge
          image: opspilot:dev
          command: [python, -m, app.run, --role, knowledge]
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe: {httpGet: {path: /api/ready, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/health, port: 8080}, periodSeconds: 10}
