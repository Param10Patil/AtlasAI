apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge
  namespace: opspilot
spec:
  replicas: 1
  selector:
    matchLabels: {app: opspilot-knowledge}
  template:
    metadata: {labels: {app: opspilot-knowledge}}
    spec:
      containers:
        - name: knowledge
          image: opspilot:dev
          args: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8080']
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
